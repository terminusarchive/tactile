[package]
name = "tactile-keys"
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
description = "On-screen overlay of pressed keys for tachyon and Hyprland"
license = "MIT"
repository = "https://github.com/terminusarchive/tactile"
readme = "README.md"
keywords = ["wayland", "tachyon", "hyprland", "keyboard", "overlay", "screencast"]
categories = ["command-line-utilities", "gui"]
include = [
    "src/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "assets/tactile.svg",
    "assets/tactile.desktop",
]

[[bin]]
name = "tactile"
path = "src/main.rs"

[dependencies]
async-channel = "2.5.0"
evdev = "0.13.2"
gtk4 = { version = "0.11.5", features = ["v4_12"] }
gtk4-layer-shell = "0.8.1"
serde_json = "1"
xkbcommon = "0.9.0"
